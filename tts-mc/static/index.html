<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giọng đọc MC</title>
<style>
:root{--bg:#fbf6f0;--card:#fff;--ink:#3a2e28;--mut:#8a7a70;--acc:#c8553d;--acc2:#e8a87c;--bd:#eadccf}
@media (prefers-color-scheme:dark){:root{--bg:#1d1714;--card:#2a211d;--ink:#f3e8df;--mut:#b5a398;--acc:#e8805f;--acc2:#a35a3f;--bd:#43352e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.6rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-bottom:16px}
textarea{width:100%;min-height:200px;resize:vertical;border:1px solid var(--bd);border-radius:12px;padding:12px;font:inherit;background:transparent;color:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label{display:block;font-size:.85rem;color:var(--mut);margin-bottom:4px}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:inherit;font:inherit}
input[type=range]{width:100%;accent-color:var(--acc)}
.val{float:right;color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
button{border:0;border-radius:999px;padding:11px 22px;font:inherit;font-weight:600;cursor:pointer;background:var(--acc);color:#fff}
button.sec{background:transparent;color:var(--ink);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:wait}
audio{width:100%;margin-top:14px}
#msg{color:var(--acc);margin-top:10px;min-height:1.4em}
.chk{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--ink);font-size:.95rem}
</style>
</head>
<body>
<main>
  <h1>🎙️ Giọng đọc MC</h1>
  <p class="sub">Chuyển văn bản thành giọng nói tiếng Việt ấm áp, truyền cảm – ngắt nghỉ và lên xuống giọng theo dấu câu.</p>

  <div class="card">
    <textarea id="text" placeholder="Nhập hoặc dán văn bản tại đây…">Kính thưa quý vị đại biểu, quý vị khách quý! Hôm nay, tại đây, chúng ta cùng nhau chứng kiến một khoảnh khắc thật đặc biệt. Bạn đã sẵn sàng chưa? Xin một tràng pháo tay thật lớn!</textarea>
    <div class="grid" style="margin-top:14px">
      <div><label>Giọng đọc</label><select id="voice"></select></div>
      <div><label>Phong cách</label><select id="style"></select></div>
    </div>
    <div class="grid" style="margin-top:14px">
      <div><label>Tốc độ <span class="val" id="rv">0</span></label><input id="rate" type="range" min="-40" max="40" value="0"></div>
      <div><label>Cao độ <span class="val" id="pv">0</span></label><input id="pitch" type="range" min="-20" max="20" value="0"></div>
      <div><label>Âm lượng <span class="val" id="vv">0</span></label><input id="volume" type="range" min="-40" max="40" value="0"></div>
    </div>
    <label class="chk"><input type="checkbox" id="expr" checked> Ngữ điệu MC (nhấn câu hỏi, cảm thán, ngắt hơi tự nhiên)</label>
    <div class="row">
      <button id="go">▶ Đọc</button>
      <button class="sec" id="dl" disabled>⬇ Tải MP3</button>
    </div>
    <div id="msg"></div>
    <audio id="player" controls hidden></audio>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
let blobUrl=null;
fetch('/api/options').then(r=>r.json()).then(o=>{
  for(const [id,list] of [['voice',o.voices],['style',o.styles]])
    $(id).innerHTML=list.map(x=>`<option value="${x.key}">${x.label}</option>`).join('');
});
for(const [i,v] of [['rate','rv'],['pitch','pv'],['volume','vv']])
  $(i).oninput=()=>$(v).textContent=($(i).value>0?'+':'')+$(i).value;
$('go').onclick=async()=>{
  $('msg').textContent='';$('go').disabled=true;$('go').textContent='Đang tạo giọng…';
  try{
    const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      text:$('text').value,voice:$('voice').value,style:$('style').value,
      rate:+$('rate').value,pitch:+$('pitch').value,volume:+$('volume').value,expressive:$('expr').checked})});
    if(!r.ok) throw new Error((await r.json()).error||r.statusText);
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl=URL.createObjectURL(await r.blob());
    $('player').src=blobUrl;$('player').hidden=false;$('player').play();$('dl').disabled=false;
  }catch(e){$('msg').textContent=e.message}
  $('go').disabled=false;$('go').textContent='▶ Đọc';
};
$('dl').onclick=()=>{const a=document.createElement('a');a.href=blobUrl;a.download='giong-noi.mp3';a.click()};
</script>
</body>
</html>
